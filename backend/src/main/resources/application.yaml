spring:
  application:
    name: casegen-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

casegen:
  image-import:
    provider: ${IMAGE_IMPORT_PROVIDER:GEMINI}
    max-bytes: ${IMAGE_IMPORT_MAX_BYTES:10485760}
    local-fallback-enabled: ${IMAGE_IMPORT_LOCAL_FALLBACK:true}
    api-key: ${IMAGE_IMPORT_API_KEY:}
    model: ${IMAGE_IMPORT_MODEL:gpt-4o-mini}
    api-url: ${IMAGE_IMPORT_API_URL:https://api.openai.com/v1/responses}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    local:
      tesseract-command: ${TESSERACT_COMMAND:tesseract}
      tesseract-language: ${TESSERACT_LANGUAGE:eng}
      minimum-width-ratio: ${IMAGE_IMPORT_LOCAL_MIN_WIDTH_RATIO:0.07}
      minimum-height-ratio: ${IMAGE_IMPORT_LOCAL_MIN_HEIGHT_RATIO:0.045}
      minimum-area-ratio: ${IMAGE_IMPORT_LOCAL_MIN_AREA_RATIO:0.004}
      minimum-rectangularity: ${IMAGE_IMPORT_LOCAL_MIN_RECTANGULARITY:0.42}
      minimum-aspect-ratio: ${IMAGE_IMPORT_LOCAL_MIN_ASPECT_RATIO:0.55}
      maximum-aspect-ratio: ${IMAGE_IMPORT_LOCAL_MAX_ASPECT_RATIO:5.5}
  generation:
    runtime-root: ${GENERATION_RUNTIME_ROOT:runtime/generation}
    process-timeout: ${GENERATION_PROCESS_TIMEOUT:PT10M}
    executor:
      core-size: ${GENERATION_EXECUTOR_CORE_SIZE:1}
      max-size: ${GENERATION_EXECUTOR_MAX_SIZE:2}
      queue-capacity: ${GENERATION_EXECUTOR_QUEUE_CAPACITY:20}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
    jwt:
      issuer: casegen
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
